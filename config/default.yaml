app:
  name: midi_mover
  window_width: 1280
  window_height: 720
  target_fps: 30
  song_title_screen_duration_seconds: 2.0
  debug: false
  logging_level: INFO
  random_seed: null

camera:
  width: 1280
  height: 720
  mirror: true

pose:
  stage1_model_name: yolo11n-pose.pt
  stage2_hand_model_name: /home/alex/data/midi_mover/handcheckpoints/hand_26n_img640_20260411_214709/weights/best.pt
  stage2_roi_expansion_px: 30
  confidence_threshold: 0.5
  iou_threshold: 0.45
  stage2_confidence_threshold: 0.5
  stage2_iou_threshold: 0.45
  stage2_missing_fallback_mode: reuse_last
  stage2_missing_fallback_timeout_seconds: 0.25
  device: cuda
  smoothing_factor: 0.35
  lost_person_timeout_seconds: 1.0

liveview:
  left_panel_ratio: 0.6
  crop_smoothing_factor: 0.35
  crop_max_jump_ratio: 0.18
  eye_target_x_ratio: 0.5
  eye_target_y_ratio: 0.15 #0.32
  eye_crop_width_multiplier: 12. #6.5
  eye_crop_above_multiplier: 8.0 #3.2
  eye_crop_below_multiplier: 2.0 #5.0
  circle_visuals:
    idle:
      outline_color: [96, 165, 250]
      fill_color: [0, 0, 0]
      label_color: [255, 255, 255]
    active_contact:
      outline_color: [250, 204, 21]
      fill_color: [59, 130, 246]
      label_color: [255, 255, 255]
    hit_flash:
      outline_color: [34, 197, 94]
      fill_color: [22, 163, 74]
      label_color: [255, 255, 255]
    miss_flash:
      outline_color: [248, 113, 113]
      fill_color: [185, 28, 28]
      label_color: [255, 255, 255]
    hit_flash_duration_ms: 180
    miss_flash_duration_ms: 220
  debug:
    show_head_center: false
    show_wrist_markers: true
    show_stage1_full_keypoints: false
    show_stage2_hand_keypoints: true
    show_keypoint_overlay_legend: true
    show_overlay_confidence_values: true
    keypoint_overlay_legend_style:
      font_size: 18
      text_color: [226, 232, 240]
      muted_text_color: [148, 163, 184]
      background_color: [2, 6, 23]
      border_color: [51, 65, 85]
      border_width: 1
      panel_padding: 8
      line_spacing: 4
    stage1_full_keypoints_style:
      keypoint_color: [147, 197, 253]
      keypoint_radius: 4
      keypoint_outline_color: [30, 64, 175]
      keypoint_outline_width: 1
      skeleton_color: [96, 165, 250]
      skeleton_width: 2
    stage2_hand_keypoints_style:
      keypoint_color: [196, 181, 253]
      keypoint_radius: 3
      keypoint_outline_color: [91, 33, 182]
      keypoint_outline_width: 1
      skeleton_color: [167, 139, 250]
      skeleton_width: 2
      emphasize_fingertips: true
      fingertip_color: [244, 114, 182]
      fingertip_radius: 6
      fingertip_outline_color: [131, 24, 67]
      fingertip_outline_width: 2
  circle_radius_percent: 5.83
  circle_offsets_percent:
    "1": [-36.0, -25.0]
    "2": [-18.0, -30.0]
    "3": [0.0, -40.0]
    "4": [18.0, -30.0]
    "5": [36.0, -25.0]
  circle_stroke_width: 4
  label_font_size: 24
  wrist_marker_radius: 10
  wrist_marker_outline_width: 2
  padding_color: [10, 18, 32]

gameplay:
  hit_window_ms: 120
  early_late_tolerance_ms: 180
  debounce_ms: 90
  swap_hands_when_mirrored: true
  note_history_ms: 1500
  lookahead_ms: 2500
  timeline_now_line_ratio: 0.75
  score_values:
    hit: 100
    miss: -25
    combo_bonus: 10

midi:
  supported_extensions: [".mid", ".midi"]
  note_mapping:
    "60": L1
    "61": L2
    "62": L3
    "63": L4
    "64": L5
    "65": R1
    "66": R2
    "67": R3
    "68": R4
    "69": R5
  track_filter: []
  channel_filter: []
  minimum_note_duration_ms: 40
  ignore_meta_events: true
  adaptive_mapping:
    enabled: false
    trigger_note_count: 10
    rolling_recent_note_buffer_size: 30
    mode: ranked_low_high
    creative_seed: 123
    creative_cycle_span: 8

audio:
  mixer:
    frequency: 44100
    size: -16
    channels: 2
    buffer: 512
    max_channels: 16
  gesture_sounds:
    L1:
      frequency_hz: 261.63
      waveform: sine
    L2:
      frequency_hz: 293.66
      waveform: sine
    L3:
      frequency_hz: 329.63
      waveform: sine
    L4:
      frequency_hz: 349.23
      waveform: sine
    L5:
      frequency_hz: 392.0
      waveform: sine
    R1:
      frequency_hz: 523.25
      waveform: sine
    R2:
      frequency_hz: 587.33
      waveform: sine
    R3:
      frequency_hz: 659.25
      waveform: sine
    R4:
      frequency_hz: 698.46
      waveform: sine
    R5:
      frequency_hz: 783.99
      waveform: sine
  volumes:
    ui: 0.7
    hit: 0.8
    cue: 0.8
  playback:
    note_duration_seconds: 0.18
    gesture_volume: 0.8
    max_concurrent_sounds: 6
    restart_busy_channel: true
    sustain_while_inside: true
    release_fade_ms: 120

highscore:
  list_size: 10
  headshot_countdown_seconds: 3.0
  headshot_crop_margin: 0.35
  thumbnail_width: 160
  thumbnail_height: 160