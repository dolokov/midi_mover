app:
  name: midi_mover
  window_width: 1280
  window_height: 720
  window_scale_factor: 1.8
  target_fps: 30
  song_title_screen_duration_seconds: 2.0
  song_summary_screen_duration_seconds: 3.0
  debug: false
  logging_level: INFO
  random_seed: null

camera:
  width: 1280
  height: 720
  mirror: true

pose:
  stage1_model_name: yolo26n-pose.pt
  stage2_hand_model_name: /home/alex/data/midi_mover/handcheckpoints/hand_26n_img640_aug_rotate_20260413_063312/weights/best.pt
  stage2_roi_expansion_px: 30
  confidence_threshold: 0.5
  iou_threshold: 0.45
  stage2_confidence_threshold: 0.5
  stage2_iou_threshold: 0.45
  stage2_missing_fallback_mode: reuse_last
  stage2_missing_fallback_timeout_seconds: 0.25
  device: cuda
  smoothing_factor: 0.35
  lost_person_timeout_seconds: 1.0

liveview:
  left_panel_ratio: 0.6
  crop_smoothing_factor: 0.35
  crop_max_jump_ratio: 0.18
  # Eye anchor: where the eye center appears in the displayed view (0.0–1.0 fraction
  # of crop width / height).  0.5 / 0.15 means "centred horizontally, eyes
  # 15% from the top of the visible crop".
  eye_center_x_pct: 0.5
  eye_center_y_pct: 0.15
  # Total crop width expressed as a multiple of the inter-eye distance.
  # Smaller value → tighter crop (bigger head).  Larger value → wider crop (smaller head).
  # e.g. 12.0 means the crop is 12× the eye distance wide.
  crop_width_eye_dist: 20.0
  circle_visuals:
    idle:
      outline_color: [96, 165, 250]
      fill_color: [0, 0, 0]
      label_color: [255, 255, 255]
    # precue: circle lights up blue N ms before the target note so the player
    # can move their hand there in time.
    precue:
      outline_color: [59, 130, 246]
      fill_color: [29, 78, 216]
      label_color: [255, 255, 255]
    active_contact:
      outline_color: [250, 204, 21]
      fill_color: [59, 130, 246]
      label_color: [255, 255, 255]
    hit_flash:
      outline_color: [34, 197, 94]
      fill_color: [22, 163, 74]
      label_color: [255, 255, 255]
    miss_flash:
      outline_color: [248, 113, 113]
      fill_color: [185, 28, 28]
      label_color: [255, 255, 255]
    hit_flash_duration_ms: 180
    miss_flash_duration_ms: 220
    # Cyan stroke drawn on top of any circle that the player's hand is
    # currently inside.  Width is in source-frame pixels (scaled with display).
    contact_stroke_color: [0, 255, 255]
    contact_stroke_width: 6
  debug:
    show_head_center: false
    show_wrist_markers: true
    show_stage1_full_keypoints: false
    show_stage2_hand_keypoints: true
    show_keypoint_overlay_legend: true
    show_overlay_confidence_values: true
    keypoint_overlay_legend_style:
      font_size: 18
      text_color: [226, 232, 240]
      muted_text_color: [148, 163, 184]
      background_color: [2, 6, 23]
      border_color: [51, 65, 85]
      border_width: 1
      panel_padding: 8
      line_spacing: 4
    stage1_full_keypoints_style:
      keypoint_color: [147, 197, 253]
      keypoint_radius: 4
      keypoint_outline_color: [30, 64, 175]
      keypoint_outline_width: 1
      skeleton_color: [96, 165, 250]
      skeleton_width: 2
    stage2_hand_keypoints_style:
      keypoint_color: [196, 181, 253]
      keypoint_radius: 3
      keypoint_outline_color: [91, 33, 182]
      keypoint_outline_width: 1
      skeleton_color: [167, 139, 250]
      skeleton_width: 2
      emphasize_fingertips: true
      fingertip_color: [244, 114, 182]
      fingertip_radius: 6
      fingertip_outline_color: [131, 24, 67]
      fingertip_outline_width: 2
  circle_radius_percent: 5.83
  # Left-hand circles — positions reachable by the left hand.
  # All offsets are percentages relative to the eye-distance-based scale unit,
  # anchored to the detected head center. Negative x = left, negative y = up.
  left_circle_offsets_percent:
    "1": [-10, -30.0]
    "2": [-24, -25.0]
    "3": [-34, -13.0]
    "4": [-40, -2.0]
    "5": [-40, 10.0]
  # Right-hand circles — positions reachable by the right hand.
  # Overlaps with left-hand circles are allowed: each circle only responds
  # to its own hand's fingertips.
  right_circle_offsets_percent:
    "1": [10.0, -30.0]
    "2": [24.0, -25.0]
    "3": [34.0, -13.0]
    "4": [40.0, -2.0]
    "5": [40.0, 10.0]

  circle_stroke_width: 4
  label_font_size: 24
  wrist_marker_radius: 10
  wrist_marker_outline_width: 2
  padding_color: [10, 18, 32]

gameplay:
  song_speed_multiplier: 1.0
  pre_song_lead_in_ms: 1000
  hit_window_ms: 120
  early_late_tolerance_ms: 180
  debounce_ms: 90
  swap_hands_when_mirrored: true
  note_history_ms: 1500
  lookahead_ms: 2500
  timeline_now_line_ratio: 0.75
  # How many milliseconds before a note's target time the circle lights up
  # blue (pre-cue) so the player has time to move their hand there.
  precue_ms: 800
  score_values:
    hit: 100
    miss: -25
    combo_bonus: 10

midi:
  supported_extensions: [".mid", ".midi"]
  note_mapping:
    "60": L1
    "61": R1
    "62": L2
    "63": R2
    "64": L3
    "65": R3
    "66": L4
    "67": R4
    "68": L5
    "69": R5
  track_filter: []
  channel_filter: []
  minimum_note_duration_ms: 40
  ignore_meta_events: true
  adaptive_mapping:
    enabled: true
    trigger_note_count: 1
    rolling_recent_note_buffer_size: 30
    mode: ranked_low_high
    creative_seed: 123
    creative_cycle_span: 8

audio:
  backend: pyfluidsynth
  fluidsynth:
    soundfont_path: "/home/alex/data/midi_mover/assets/soundfonts/jnsgm2/Jnsgm2.sf2"
    sample_rate: 44100
    gain: 0.5
    polyphony: 256
    audio_driver: null
    audio_buffer_size: 64
    instrument_profile: synth_lead #null
    reverb:
      enabled: true
      room_size: 0.35
      damping: 0.25
      width: 0.6
      level: 0.75
    chorus:
      enabled: false
      voices: 3
      level: 1.2
      speed: 0.3
      depth_ms: 8.0
      waveform: sine
